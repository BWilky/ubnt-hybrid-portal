<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE watchdog fleet</title>
<style>
  :root {
    --bg: #252b33;
    --panel: #2d343e;
    --line: #3a424e;
    --ink: #dce3ea;
    --ink-dim: #8d99a6;
    --amber: #e8a33d;
    --ok: #6fbf73;
    --bad: #e06c5f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 20px 28px 14px; border-bottom: 2px solid var(--amber);
  }
  header h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--ink-dim); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 14px; font: inherit; font-size: 13.5px; cursor: pointer;
  }
  button:hover { border-color: var(--amber); }
  button.primary { background: var(--amber); border-color: var(--amber); color: #241d10; font-weight: 600; }
  button:disabled { opacity: .45; cursor: wait; }
  main { padding: 18px 28px 60px; max-width: 1180px; }
  table { border-collapse: collapse; width: 100%; }
  th {
    text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-dim);
    padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.mono, .mono { font-family: var(--mono); font-size: 13px; }
  tr:hover td { background: rgba(232,163,61,0.04); }
  .led {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px;
    vertical-align: 1px; background: var(--ink-dim);
  }
  .led.ok { background: var(--ok); box-shadow: 0 0 5px rgba(111,191,115,.7); }
  .led.bad { background: var(--bad); box-shadow: 0 0 5px rgba(224,108,95,.7); }
  .led.warn { background: var(--amber); box-shadow: 0 0 5px rgba(232,163,61,.7); }
  .state { font-size: 13px; }
  .state small { display: block; color: var(--ink-dim); font-size: 11.5px; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { padding: 4px 10px; font-size: 12.5px; }
  #empty { color: var(--ink-dim); padding: 40px 0; }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--amber); border-radius: 5px;
    padding: 10px 18px; font-size: 13.5px; display: none; max-width: 80vw;
  }
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 0; width: min(720px, 92vw); max-height: 84vh;
  }
  dialog::backdrop { background: rgba(15,18,22,.65); }
  dialog .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
  }
  dialog .head h2 { font-size: 15px; margin: 0; }
  dialog .body { padding: 16px 18px; overflow: auto; max-height: 66vh; }
  dialog pre {
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px;
  }
  .field { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .field label { font-size: 13px; color: var(--ink-dim); font-family: var(--mono); }
  .field input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    color: var(--ink); padding: 6px 9px; font-family: var(--mono); font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--amber); }
  .hint { color: var(--ink-dim); font-size: 12.5px; margin: 4px 0 14px; }
</style>
</head>
<body>
<header>
  <h1>PoE watchdog fleet</h1>
  <span class="sub" id="lastSync">not synced yet</span>
  <span class="spacer"></span>
  <button id="btnSync">Sync from UISP</button>
  <button id="btnCheckAll">Check drift on all</button>
  <button id="btnDeployAll" class="primary">Deploy to all</button>
</header>

<main>
  <table id="tbl" hidden>
    <thead>
      <tr>
        <th>Device</th><th>IP</th><th>Model</th><th>UISP</th>
        <th>Watchdog</th><th>Last deploy</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty">No devices yet. Sync from UISP to pull your ER-X-SFP fleet.</div>
</main>

<div id="toast"></div>

<dialog id="dlg">
  <div class="head"><h2 id="dlgTitle"></h2><button onclick="dlg.close()">Close</button></div>
  <div class="body" id="dlgBody"></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const dlg = $('#dlg');
let DEFAULTS = null;

function toast(msg, ms = 3500) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms);
}

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function syncLed(d) {
  const c = d.lastCheck;
  if (!c) return ['', 'never checked', ''];
  if (c.error) return ['bad', 'unreachable', c.error];
  if (!c.installed) return ['bad', 'not installed', ''];
  if (!c.inSync) return ['warn', 'drift detected', 'remote script differs from rendered config'];
  if (!c.scheduled) return ['warn', 'in sync, no scheduler', ''];
  return ['ok', 'in sync + scheduled', ''];
}

function render(devs) {
  const tbl = $('#tbl'), empty = $('#empty'), rows = $('#rows');
  rows.innerHTML = '';
  tbl.hidden = devs.length === 0;
  empty.style.display = devs.length ? 'none' : 'block';
  for (const d of devs) {
    const [cls, label, detail] = syncLed(d);
    const dep = d.lastDeploy
      ? (d.lastDeploy.ok !== false ? new Date(d.lastDeploy.at).toLocaleString() : 'failed: ' + (d.lastDeploy.error || ''))
      : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="led ${d.online ? 'ok' : 'bad'}"></span>${esc(d.name)}
          <small style="color:var(--ink-dim);display:block;margin-left:16px">${esc(d.site || '')}</small></td>
      <td class="mono">${esc(d.ip)}</td>
      <td class="mono">${esc(d.model)}</td>
      <td class="state">${d.online ? 'online' : 'offline'}</td>
      <td class="state"><span class="led ${cls}"></span>${label}<small>${esc(detail || (d.lastCheck ? new Date(d.lastCheck.at).toLocaleString() : ''))}</small></td>
      <td class="state">${esc(dep)}</td>
      <td><div class="row-actions">
        <button data-a="check">Check</button>
        <button data-a="deploy">Deploy</button>
        <button data-a="status">Status</button>
        <button data-a="config">Config</button>
        <button data-a="preview">Script</button>
      </div></td>`;
    tr.querySelectorAll('button').forEach((b) =>
      b.addEventListener('click', () => act(b.dataset.a, d, b)));
    rows.appendChild(tr);
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load() {
  const j = await api('GET', '/api/devices');
  $('#lastSync').textContent = j.lastSync ? 'synced ' + new Date(j.lastSync).toLocaleString() : 'not synced yet';
  render(j.devices.sort((a, b) => a.name.localeCompare(b.name)));
}

async function act(a, d, btn) {
  btn && (btn.disabled = true);
  try {
    if (a === 'check') { await api('POST', `/api/devices/${d.key}/check`); toast(`${d.name}: checked`); }
    if (a === 'deploy') { const r = await api('POST', `/api/devices/${d.key}/deploy`); toast(`${d.name}: ${r.result.steps.join(', ')}`); }
    if (a === 'preview') { window.open(`/api/devices/${d.key}/preview`, '_blank'); }
    if (a === 'status') {
      $('#dlgTitle').textContent = d.name + ' — watchdog status';
      $('#dlgBody').innerHTML = '<pre>connecting…</pre>'; dlg.showModal();
      const r = await api('GET', `/api/devices/${d.key}/watchdog`);
      $('#dlgBody').innerHTML = `<pre>${esc(r.status)}</pre><p class="hint">Recent log lines</p><pre>${esc(r.logs || '(none)')}</pre>`;
    }
    if (a === 'config') openConfig(d);
  } catch (e) { toast(`${d.name}: ${e.message}`, 6000); }
  btn && (btn.disabled = false);
  if (a === 'check' || a === 'deploy') load();
}

function openConfig(d) {
  const keys = Object.keys(DEFAULTS);
  $('#dlgTitle').textContent = d.name + ' — per-device overrides';
  $('#dlgBody').innerHTML = `
    <p class="hint">Blank fields inherit the fleet default (shown as placeholder). Save, then deploy to apply.</p>
    ${keys.map((k) => `
      <div class="field">
        <label>${k}</label>
        <input name="${k}" placeholder="${esc(DEFAULTS[k])}" value="${esc((d.overrides || {})[k] ?? '')}">
      </div>`).join('')}
    <button class="primary" id="saveCfg">Save overrides</button>`;
  dlg.showModal();
  $('#saveCfg').onclick = async () => {
    const body = {};
    $('#dlgBody').querySelectorAll('input').forEach((i) => (body[i.name] = i.value.trim()));
    await api('PUT', `/api/devices/${d.key}/overrides`, body);
    dlg.close(); toast(`${d.name}: overrides saved — deploy to apply`); load();
  };
}

$('#btnSync').onclick = async (e) => {
  e.target.disabled = true;
  try { const r = await api('POST', '/api/sync'); toast(`UISP sync: ${r.count} switches found`); await load(); }
  catch (err) { toast('Sync failed: ' + err.message, 6000); }
  e.target.disabled = false;
};
$('#btnDeployAll').onclick = fleet('deploy-all', 'Deploying to fleet…');
$('#btnCheckAll').onclick = fleet('check-all', 'Checking fleet…');

function fleet(action, msg) {
  return async (e) => {
    e.target.disabled = true; toast(msg, 60000);
    try {
      const r = await api('POST', '/api/' + action);
      const bad = r.results.filter((x) => !x.ok);
      toast(bad.length ? `Done with ${bad.length} failure(s): ${bad.map((b) => b.name).join(', ')}` : 'Fleet: all good', 6000);
    } catch (err) { toast('Failed: ' + err.message, 6000); }
    e.target.disabled = false; load();
  };
}

// fetch fleet defaults once (for the config dialog placeholders)
(async () => {
  DEFAULTS = await api('GET', '/api/defaults').then((j) => j.defaults).catch(() => ({}));
  load();
})();
</script>
</body>
</html>
